//Name: RePruning v0.0.5
//Author: DeRoPEN_DEv
//Platform: ReHLDS
//Mandatory: ReHLDS 3.15.0.896-dev + ReAPI v5.29.0.359-dev + Metamod-R 1.3.0.149 + AMXModX 1.10+ + ReGameDLL 5.30.0.814-dev
//Description: Active mode selector for RePruning Mode Settings (zm / deathrun / csdm / dm / pub / lasers / custom)
//Reminder: List pruning_mode_settings.amxx AFTER repruning.amxx in plugins.ini; presets are configs/pruning_mode_<name>.cfg
//Sites: github.com/DeRoPEN31 and deropen.fun
//
// This file is parsed by the mode plugin and accepts only these commands:
//   pruning_mode <name>      preset applied when no map prefix matches ("" = nothing applied)
//   pruning_mode_auto <0|1>  auto mode by map prefix (default 1)
//   map <prefix> <preset>    own map rule — the longest matching prefix wins
// Other cvars belong to pruning.cfg / pruning_baning.cfg, not here.

// Preset used when the map matches no prefix (or pruning_mode_auto is 0):
pruning_mode ""

// Built-in prefixes: ze_ zm_ -> zm | dr_ deathrun_ -> deathrun | dm_ -> dm | csdm_ -> csdm | de_ cs_ fy_ as_ -> pub
// Own map rules (uncomment to use):
// pruning_mode_auto 1
// map ze_   zm
// map zm_   zm
// map dr_   deathrun
// map dm_   dm
// map csdm_ csdm
// map de_   pub
// map cs_   pub
