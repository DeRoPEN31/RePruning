//Name: RePruning v0.0.6
//Author: DeRoPEN_DEv
//Platform: ReHLDS
//Mandatory: ReHLDS 3.15.0.896-dev + ReAPI v5.29.0.359-dev + Metamod-R 1.3.0.149 + AMXModX 1.10+ + ReGameDLL 5.30.0.814-dev
//Description: A plugin for removing, cleaning up, or disabling various features on CS 1.6 servers
//Reminder: Use 0 to disable the feature, and 1 to enable it
//Sites: github.com/DeRoPEN31 and deropen.fun

// Logging: 0 = off, 1 = errors only, 2 = errors + actions, 3 = verbose (file: addons/amxmodx/logs/RePruning.log)
pruning_log_level "2"

// Console language of plugin messages: folder code from data/repruning (us, ru, ua, kz, de, dk, fr, pl, se)
pruning_lang "us"

// Disables buying (buy menu, weapon/ammo commands, autobuy/rebuy)
pruning_buy "1"

// Removes buy zones (func_buyzone) and hides the "$" HUD icon
pruning_buyzone_remove "1"

// Resets money to 0, blocks money rewards, and hides money from the HUD
pruning_money "1"

// Removes bomb sites (func_bomb_target / info_bomb_target)
pruning_plantzone "1"

// Blocks giving C4 to terrorists on spawn
pruning_bomb_give "1"

// Removes all C4 entities (inventory, dropped backpack, planted bomb) every round
pruning_bomb_remove "1"

// Hides HUD icons (C4, buy zone, defuser, flashlight, nightvision)
pruning_icons "1"

// Blocks radio commands and radio voice lines
pruning_radio "1"

// Keeps round win sounds (terwin/ctwin/rounddraw) when pruning_radio is enabled (0 = disable)
pruning_radio_winsounds "1"

// Removes hostages and hostage rescue zones
pruning_hostages "1"

// Disables VIP mode and removes VIP escape zones
pruning_vip "1"

// Disables blood sprites, bullet impact smoke, sparks, and ricochets
pruning_effects "1"

// Disables bullet holes and blood decals on walls
pruning_decals "1"

// Removes player corpses on death
pruning_corpses "1"

// Removes dropped weapons (weaponbox) and defuse kits (item_thighpack)
pruning_dropweapons "1"

// Blocks default game messages and plugin prints in the client console
pruning_console "1"

// Blocks popup game hints (HudText/HudTextPro/HudTextArgs)
pruning_hints "1"

// Enables client file MD5 hash checking (configured in configs/pruning_files.cfg) — DEFAULT OFF, a loud warning is printed on enable; ban cvars live in pruning_baning.cfg
pruning_files "0"
