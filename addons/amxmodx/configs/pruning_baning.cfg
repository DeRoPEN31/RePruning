//Name: RePruning v0.0.6
//Author: DeRoPEN_DEv
//Platform: ReHLDS
//Mandatory: ReHLDS 3.15.0.896-dev + ReAPI v5.29.0.359-dev + Metamod-R 1.3.0.149 + AMXModX 1.10+ + ReGameDLL 5.30.0.814-dev
//Description: Autonomous ban system for RePruning: file-mismatch bans auto-expire, entries are validated and self-cleaned
//Reminder: Entries live in data/repruning_bans.txt as "steamid expiry_unix" — no manual cleanup needed
//Sites: github.com/DeRoPEN31 and deropen.fun

// Kicks the client on file mismatch (0 = log only)
pruning_files_kick "1"

// Send the Steam Cloud/MD5 fix guide (chat + MOTD) to a client with a mismatched file
pruning_files_fix "1"

// File mismatches allowed per client before a ban (0 = never ban)
pruning_files_maxfails "3"

// Ban length in minutes for repeat offenders (0 = kick only)
pruning_files_bantime "30"

// Autonomous ban list master switch (connect-time rejections; 0 = the list is not used)
pruning_bans "1"

// Maximum ban length in hours — any longer ban is clamped (0 = unlimited)
pruning_bans_ttl "720"

// Automatic removal of expired entries (on load + every hour; 0 = manual only)
pruning_bans_cleanup "1"

// Hard cap of ban list entries — the earliest-expiring entry is evicted first
pruning_bans_max "500"

// Player identifier system: pruningid shows your own ID, pruning_ids (admins, flag d) prints the table of all players; 0 = off
pruning_ids "1"
